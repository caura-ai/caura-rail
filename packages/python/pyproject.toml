[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "caura-rail"
version = "1.0.1"
description = "Memory operations around every agent turn, for managed and self-hosted Caura."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Caura" }]
dependencies = ["httpx>=0.27,<1"]
keywords = ["caura", "memory", "agents", "llm", "recall", "governance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/caura-ai/caura-rail"
Documentation = "https://github.com/caura-ai/caura-rail/tree/main/docs"
Repository = "https://github.com/caura-ai/caura-rail"
Changelog = "https://github.com/caura-ai/caura-rail/blob/main/CHANGELOG.md"
Issues = "https://github.com/caura-ai/caura-rail/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11", "mypy>=1.14", "build>=1.2", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/caura_rail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
