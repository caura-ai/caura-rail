name: DCO

# Verifies every commit on a pull request carries a `Signed-off-by:`
# trailer asserting the Developer Certificate of Origin
# (https://developercertificate.org/). DCO is our lightweight
# alternative to a CLA — see CONTRIBUTING.md § Pull requests. Ported
# from caura-ai/caura's copy; the job keeps the name ``DCO``, which is
# the check main's branch protection requires here.
#
# This is the gate. PRs without sign-off on each commit will fail and
# cannot be merged.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check DCO sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          HEAD="$HEAD_SHA"
          FAILED=()
          # Commits already on main were checked when they landed there (or
          # predate this gate). Exclude them so a PR that merges main into a
          # long-lived feature branch is judged only on its own commits.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          while IFS= read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              FAILED+=("$sha")
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD" ^origin/main)

          if [ "${#FAILED[@]}" -ne 0 ]; then
            echo "::error::The following commits are missing a Signed-off-by trailer:"
            for sha in "${FAILED[@]}"; do
              SUBJECT=$(git log -1 --format=%s "$sha")
              echo "  $sha  $SUBJECT"
            done
            cat <<EOF

          ── How to fix ──
          For the most-recent commit:
            git commit --amend -s --no-edit && git push --force-with-lease

          For multiple older commits, rebase to add sign-off to each:
            git rebase --signoff "$BASE"
            git push --force-with-lease

          Configure your local git to sign off automatically going forward:
            git config --global format.signoff true

          See CONTRIBUTING.md § Pull requests for context.
          EOF
            exit 1
          fi

          echo "All commits signed off ✓"
