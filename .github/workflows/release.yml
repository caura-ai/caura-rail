name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: python -m pip install -e "packages/python[dev]"
      - run: npm ci --ignore-scripts
      - name: Check that both packages carry the same version and it matches the tag
        id: version
        shell: bash
        run: |
          py=$(python -c 'import tomllib; print(tomllib.load(open("packages/python/pyproject.toml","rb"))["project"]["version"])')
          js=$(node -p 'require("./packages/typescript/package.json").version')
          test "$py" = "$js" || { echo "version mismatch: python $py, npm $js"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$py" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $py"; exit 1; }
          fi
          echo "version=$py" >> "$GITHUB_OUTPUT"
      - run: python -m pytest packages/python/tests -q
      - run: npm test
      - run: python -m build packages/python
      - run: python -m twine check packages/python/dist/*
      - run: npm pack --workspace @caura/rail --pack-destination dist-npm
      - run: python contracts/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: packages/python/dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-dist
          path: dist-npm/

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: packages/python/dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-dist
          path: dist-npm/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: packages/python/dist/
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist-npm/caura-rail-*.tgz --access public --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" packages/python/dist/* dist-npm/*.tgz \
            --title "v${{ needs.build.outputs.version }}" --notes-file <(awk '/^## /{n++} n==2' CHANGELOG.md)
