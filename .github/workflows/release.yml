name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: python -m pip install -e "packages/python[dev]"
      - run: npm ci --ignore-scripts
      - name: Check that both packages carry the same version and it matches the tag
        id: version
        shell: bash
        run: |
          py=$(python -c 'import tomllib; print(tomllib.load(open("packages/python/pyproject.toml","rb"))["project"]["version"])')
          js=$(node -p 'require("./packages/typescript/package.json").version')
          test "$py" = "$js" || { echo "version mismatch: python $py, npm $js"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$py" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $py"; exit 1; }
          fi
          echo "version=$py" >> "$GITHUB_OUTPUT"
      - run: python -m pytest packages/python/tests -q
      - run: npm test
      - run: python -m build packages/python
      - run: python -m twine check packages/python/dist/*
      - run: mkdir -p dist-npm && npm pack --workspace @caura/rail --pack-destination dist-npm
      - run: python contracts/smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: packages/python/dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dist
          path: dist-npm/

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: packages/python/dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-dist
          path: dist-npm/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: Publish to npm with provenance
        shell: bash
        env:
          # With NPM_TOKEN set, setup-node's registry-url makes npm use it. Without
          # it, npm >= 11.5 exchanges the job's OIDC token for publish rights when
          # the package lists this repository and workflow as a trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          npm --version
          if npm view "@caura/rail@${{ needs.build.outputs.version }}" version >/dev/null 2>&1; then
            echo "@caura/rail@${{ needs.build.outputs.version }} is already on npm; skipping"
          else
            # The leading ./ matters: a bare "dir/file.tgz" is parsed as a GitHub shorthand.
            npm publish ./dist-npm/caura-rail-*.tgz --access public --provenance
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ needs.build.outputs.version }}" >/dev/null 2>&1 && exit 0
          gh release create "v${{ needs.build.outputs.version }}" packages/python/dist/* dist-npm/*.tgz \
            --title "v${{ needs.build.outputs.version }}" --notes-file <(awk '/^## /{n++} n==2' CHANGELOG.md)
