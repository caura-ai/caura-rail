name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push to an open pull request supersedes the run on its previous head, whose
# result nobody acts on once it is behind, so that run is cancelled. Runs on main
# are left to finish. The group includes the workflow name because concurrency
# groups are repository-wide.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Open-source Caura release the live job verifies against. Update deliberately.
  CAURA_SERVER_REF: backend-v2.47.5

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "packages/python[dev]"
      - run: python -m ruff check . && python -m ruff format --check .
      # Strict typing covers the library, the SDK examples, and the contract tools; the
      # full applications under examples/ carry their own tests and dependencies.
      - run: python -m mypy --config-file packages/python/pyproject.toml packages/python/src/caura_rail examples/fleet.py contracts
      # Contributors also work on Windows; check the same files against the Windows
      # standard library so posix-only calls are caught here, not on their machines.
      - run: python -m mypy --platform win32 --config-file packages/python/pyproject.toml packages/python/src/caura_rail examples/fleet.py contracts
      - run: python -m pytest packages/python/tests -q
      - run: python -m build packages/python
      - run: python -m twine check packages/python/dist/*
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/rail-wheel"
          "$RUNNER_TEMP/rail-wheel/bin/python" -m pip install packages/python/dist/*.whl
          # The installed wheel must report the version in source; release-please bumps it.
          # sed, not tomllib: this job also runs on Python 3.10, which has no tomllib.
          EXPECTED=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/python/pyproject.toml)
          test -n "$EXPECTED"
          export EXPECTED
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/rail-wheel/bin/python" -c 'import os, caura_rail; from caura_rail import MemoryScope, Rail, AsyncRail; assert caura_rail.__version__ == os.environ["EXPECTED"], caura_rail.__version__; assert MemoryScope(agent_id="smoke").tenant_id is None'

  typescript:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install tarball outside checkout
        shell: bash
        run: |
          # The installed tarball must report the version in source; release-please bumps it.
          EXPECTED=$(node -p 'require("./packages/typescript/package.json").version')
          npm pack --workspace @caura/rail --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/rail-npm"
          cd "$RUNNER_TEMP/rail-npm"
          npm init -y
          npm install --ignore-scripts "$RUNNER_TEMP"/caura-rail-*.tgz
          node --input-type=module -e 'import { MemoryScope, Rail } from "@caura/rail"; if (new MemoryScope({ agentId: "smoke" }).tenantId !== undefined) process.exit(1);'
          test "$(node -p 'require("@caura/rail/package.json").version')" = "$EXPECTED"

  interoperability:
    name: Python and TypeScript HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install build mypy
      - run: npm ci --ignore-scripts
      - run: python -m build packages/python
      - name: Verify installed artifacts together over HTTP, then every documentation code block
        shell: bash
        run: |
          npm pack --workspace @caura/rail --pack-destination "$RUNNER_TEMP"
          python -m venv "$RUNNER_TEMP/rail-contract-env"
          "$RUNNER_TEMP/rail-contract-env/bin/python" -m pip install mypy packages/python/dist/*.whl
          mkdir "$RUNNER_TEMP/rail-contract"
          cp -R contracts README.md docs "$RUNNER_TEMP/rail-contract/"
          cd "$RUNNER_TEMP/rail-contract"
          npm init -y
          npm install --ignore-scripts "$RUNNER_TEMP"/caura-rail-*.tgz typescript@5 @types/node@24
          "$RUNNER_TEMP/rail-contract-env/bin/python" contracts/smoke.py
          "$RUNNER_TEMP/rail-contract-env/bin/python" contracts/verify_docs.py --workdir "$PWD" README.md docs/*.md

  live:
    name: Live Caura server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: caura-ai/caura
          ref: ${{ env.CAURA_SERVER_REF }}
          path: caura-server
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Select the matching backend image version
        working-directory: caura-server
        shell: bash
        run: |
          # The compose file pulls ghcr :latest unless CAURA_VERSION names an
          # image tag, and :latest has lagged releases. Pin the image to the
          # same release as the checkout (tag backend-vX.Y.Z -> image vX.Y.Z).
          if [[ ! "$CAURA_SERVER_REF" =~ ^backend-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CAURA_SERVER_REF must be a backend-vX.Y.Z release tag"
            exit 1
          fi
          version="${CAURA_SERVER_REF#backend-}"
          echo "CAURA_VERSION=$version" >> "$GITHUB_ENV"
          CAURA_VERSION="$version" docker compose config --images
      - name: Start the selected Caura release in standalone mode
        working-directory: caura-server
        run: docker compose up -d --wait --wait-timeout 240 --quiet-pull --pull always --no-build
      - name: Verify the running backend version
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with urllib.request.urlopen("http://localhost:8000/api/v1/version", timeout=30) as response:
              actual = json.load(response)["version"]
          expected = os.environ["CAURA_VERSION"].removeprefix("v")
          if actual.removeprefix("v") != expected:
              raise SystemExit(f"Backend version mismatch: expected {expected}, got {actual}")
          print(f"Verified running Caura backend {actual}")
          PY
      - run: python -m pip install -e packages/python
      - run: npm ci --ignore-scripts && npm run build
      - name: Run live verification with both clients
        env:
          CAURA_URL: http://localhost:8000
          CAURA_API_KEY: standalone
        run: |
          python contracts/live.py
          python examples/fleet.py
          node examples/fleet.mjs
      - name: Server logs on failure
        if: failure()
        working-directory: caura-server
        run: docker compose logs --tail 200 core-api
      - name: Remove disposable backend containers and data
        if: always()
        working-directory: caura-server
        run: docker compose down --volumes --remove-orphans

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install pip-audit ./packages/python
      - name: pip-audit the installed Python package and its dependencies
        run: python -m pip_audit --desc
      - run: npm ci --ignore-scripts
      - name: npm audit (development dependencies; the package has no runtime dependencies)
        run: npm audit --audit-level=high

  ci:
    # The required "CI" check: main's branch protection requires a check with this
    # name, and it fails unless every job above succeeded. ``always()`` makes it
    # run, and fail, when a needed job failed, was cancelled or was skipped;
    # without it this job would itself be skipped, and a skipped required check
    # counts as passing. A new job must be added to ``needs`` to be gated.
    # The needs map arrives through the environment, not spliced into the script.
    name: CI
    if: ${{ always() }}
    needs: [python, typescript, interoperability, live, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          not_ok=$(echo "${NEEDS}" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "${not_ok}" ]; then
            echo "::error::CI jobs that did not succeed: ${not_ok}"
            exit 1
          fi
